name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-build
          - os: windows-latest
            artifact_name: windows-build
          - os: ubuntu-latest
            artifact_name: linux-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application Installer
        run: npm run make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-build'
          merge-multiple: true

      - name: Generate Release Notes
        run: |
          set -euo pipefail
          git fetch --force --tags

          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-version:refname | awk -v current="$current_tag" '
            $0 == current { found = 1; next }
            found { print; exit }
          ')"

          {
            echo "## What's Changed"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s' "${previous_tag}..${current_tag}"
            else
              git log --pretty=format:'- %s' "${current_tag}^!"
            fi
            echo
            echo
            echo "## Full Changelog"
            if [ -n "$previous_tag" ]; then
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
            else
              echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${current_tag}"
            fi
          } > release-notes.md

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/**/*
          body_path: release-notes.md
